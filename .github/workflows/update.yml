name: Daily house search

on:
  schedule:
    # Evening slots from 07:13 to 10:43 UTC: 8:13-11:43pm NZDT, 7:13-10:43pm NZST.
    # GitHub often starts scheduled runs late or skips them; the first slot that runs
    # after 8pm NZ does the search and the rest skip (see scraper/update.py).
    - cron: "13 7-10 * * *"
    - cron: "43 7-10 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scraper/**"
      - "data/routes.json"
      - ".github/workflows/update.yml"

permissions:
  contents: write

concurrency:
  group: house-search
  cancel-in-progress: false

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main  # latest data, even when a run waited behind another one

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Valuation and title lookups are cached between runs instead of committed.
      - uses: actions/cache@v4
        with:
          path: |
            data/valuations.json
            data/titles.json
            data/roaddist.json
            data/lastrun.json
            data/commute.json
            data/sold.json
          key: lookups-${{ github.run_id }}
          restore-keys: lookups-

      - name: Search listings
        id: search
        env:
          EVENT: ${{ github.event_name }}
        run: python scraper/update.py

      - name: Commit results
        if: steps.search.outputs.changed == 'true'
        run: |
          git config user.name "house-hunt bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/houses.json data/photos.json
          for f in data/route_paths.json data/stop_addresses.json data/suburbs.json; do if [ -f "$f" ]; then git add "$f"; fi; done
          git commit -m "Listings ${{ steps.search.outputs.date }}: ${{ steps.search.outputs.new_count }} new"
          git pull --rebase -X theirs   # on a clash in generated data, keep this run's files
          git push
