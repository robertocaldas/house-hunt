name: Daily house search

on:
  schedule:
    # 8pm New Zealand time: 07:00 UTC during NZDT, 08:00 UTC during NZST.
    # The script skips runs that land before 8pm NZ.
    - cron: "0 7 * * *"
    - cron: "0 8 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scraper/**"
      - "data/routes.json"
      - ".github/workflows/update.yml"

permissions:
  contents: write

concurrency:
  group: house-search
  cancel-in-progress: false

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Search listings
        id: search
        env:
          EVENT: ${{ github.event_name }}
        run: python scraper/update.py

      - name: Commit results
        if: steps.search.outputs.changed == 'true'
        run: |
          git config user.name "house-hunt bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/houses.json data/photos.json
          git commit -m "Listings ${{ steps.search.outputs.date }}: ${{ steps.search.outputs.new_count }} new"
          git pull --rebase
          git push
